{% extends "base.html" %}

{% block title %}Analytics | PhishGuard{% endblock %}

{% block content %}
<section class="page-card">
    <h1>Scan Analytics</h1>
    <p class="subtitle">Summary of URL scans performed by the application.</p>

    <div class="stats-grid">
        <div class="stat-card">
            <h3>Total Scans</h3>
            <p>{{ total }}</p>
        </div>

        <div class="stat-card">
            <h3>Phishing Predictions</h3>
            <p class="danger-text">{{ phishing }}</p>
        </div>

        <div class="stat-card">
            <h3>Legitimate Predictions</h3>
            <p class="safe-text">{{ legitimate }}</p>
        </div>
    </div>
</section>
{% endblock %}
